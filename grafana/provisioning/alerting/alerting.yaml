apiVersion: 1

# Configure DISCORD_MONITOR_WEBHOOK_URL in the Grafana container environment
# with a Discord *incoming webhook URL*. Do not put webhook URLs or tokens in Git.
contactPoints:
  - orgId: 1
    name: bharatgpilot-operations
    receivers:
      - uid: bgp-operations-webhook
        type: discord
        settings:
          url: $DISCORD_MONITOR_WEBHOOK_URL
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: bharatgpilot-operations
    group_by:
      - alertname
      - cluster
      - job
    group_wait: 10s
    group_interval: 2m
    repeat_interval: 1h
    routes:
      - receiver: bharatgpilot-operations
        object_matchers:
          - ["severity", "=", "critical"]
        group_wait: 5s
