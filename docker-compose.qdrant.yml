# Optional local Qdrant overlay. Set QDRANT_API_KEY in the shell or .env;
# never commit a real key. The published HTTP port is loopback-only.
services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY before starting Qdrant}
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
