yaml
name: BharatGpilot Production Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Workspace
      uses: actions/checkout@v4

    - name: Set up Python Build Engine
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Verify Configuration Manifests
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Set up Docker Buildx Environment
      uses: docker/setup-buildx-action@v3

    - name: Build Container Sandbox Validation
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: bharatgpilot:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
