name: BharatGPilot Research Service CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/browser-extension-sidepanel, feat/session-rotation-rag-scale-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research-service/requirements.txt
      - name: Install service dependencies
        working-directory: research-service
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        working-directory: research-service
        run: python -m unittest discover -s tests -v
      - name: Validate Docker Compose configuration
        env:
          BGP_RESEARCH_API_TOKEN: ci-placeholder-service-token
          QDRANT_API_KEY: ci-placeholder-qdrant-key
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-grafana-password
        run: docker compose config --quiet
