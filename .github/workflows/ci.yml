name: BharatGPilot CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main, feat/agent-memory-n8n-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run test suite
        run: npm test

      - name: Type-check TypeScript contracts and provider services
        run: npm run typecheck

  security-gate:
    name: Security gate
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI matrix job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = "success"
          echo "All required BharatGPilot CI matrix checks passed."
