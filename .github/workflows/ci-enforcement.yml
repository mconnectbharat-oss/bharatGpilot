name: BharatGPilot CI Workspace Logic Enforcement Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/session-rotation-rag-scale-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-enforcement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-validation:
    name: Node.js tests and TypeScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies without lifecycle scripts
        run: npm install --package-lock=false --ignore-scripts
      - name: Run Node.js test suite
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck

  research-service-validation:
    name: Python research service and Compose checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research-service/requirements.txt
      - name: Install research service dependencies
        working-directory: research-service
        run: python -m pip install -r requirements.txt
      - name: Run research service tests
        working-directory: research-service
        run: python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        env:
          BGP_RESEARCH_API_TOKEN: ci-placeholder-service-token
          QDRANT_API_KEY: ci-placeholder-qdrant-key
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-grafana-password
        run: docker compose config --quiet

  workspace-security-gate:
    name: Secret-pattern and preview-isolation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reject hard-coded database connection URLs in source
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          roots = [Path('src'), Path('research-service'), Path('server.js')]
          pattern = re.compile(r'\bpostgres(?:ql)?://[^\s\"\'`]+', re.IGNORECASE)
          suffixes = {'.js', '.ts', '.tsx', '.py', '.json', '.yml', '.yaml'}
          found = []
          for root in roots:
              files = [root] if root.is_file() else root.rglob('*') if root.exists() else []
              for path in files:
                  if path.is_file() and path.suffix in suffixes:
                      try:
                          for line_number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                              if pattern.search(line):
                                  found.append(f'{path}:{line_number}')
                      except (UnicodeDecodeError, OSError):
                          pass
          if found:
              print('\n'.join(found))
              raise SystemExit('Database connection URL pattern found in source; use environment-based secrets.')
          print('No hard-coded database URL patterns found in scanned source paths.')
          PY
      - name: Ensure existing Vercel entrypoint is preserved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          if not any(item.get('src') == 'server.js' and item.get('use') == '@vercel/node' for item in config.get('builds', [])):
              raise SystemExit('vercel.json must preserve the existing Express serverless entrypoint.')
          print('Existing Vercel server.js entrypoint is preserved.')
          PY

  enforce-security-pass:
    name: Required validation status
    if: always()
    needs: [node-validation, research-service-validation, workspace-security-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to pass
        env:
          NODE_RESULT: ${{ needs.node-validation.result }}
          PYTHON_RESULT: ${{ needs.research-service-validation.result }}
          SECURITY_RESULT: ${{ needs.workspace-security-gate.result }}
        run: |
          test "$NODE_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$SECURITY_RESULT" = success
          echo 'All required validation jobs passed.'
