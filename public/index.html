

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111318">
<title>BharatGPilot — Designed by Mohit Saha</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #111318;
  color: #f1f0ec;
  height: 100vh;
  overflow: hidden;
}

button, textarea, select {
  font: inherit;
}

button {
  cursor: pointer;
  color: inherit;
}

.app {
  display: flex;
  height: 100vh;
}

/* Sidebar */

.sidebar {
  width: 265px;
  background: #17181d;
  border-right: 1px solid #292b32;
  display: flex;
  flex-direction: column;
  padding: 18px 13px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 5px 8px 22px;
}

.logo {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #f0a184, #b95c3d);
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: #211612;
  font-size: 20px;
  font-weight: 800;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
}

.brand-name {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.brand-tagline {
  font-size: 11px;
  color: #a5a6ad;
  margin-top: 4px;
  letter-spacing: 0.15px;
}

.new-chat {
  background: #292b33;
  border: none;
  padding: 11px;
  border-radius: 9px;
  text-align: left;
  margin-bottom: 20px;
}

.section-label {
  font-size: 11px;
  color: #858790;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 10px;
}

.history {
  flex: 1;
  overflow-y: auto;
}

.history button {
  width: 100%;
  padding: 10px;
  background: transparent;
  border: none;
  border-radius: 8px;
  text-align: left;
  color: #b9bac0;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history button:hover {
  background: #292b33;
}

.profile {
  border-top: 1px solid #2b2d34;
  padding: 14px 8px 5px;
  font-size: 13px;
  color: #deddd9;
}

/* Main */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 58px;
  border-bottom: 1px solid #292b32;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}

.model-select {
  background: transparent;
  color: #e8e7e4;
  border: none;
  padding: 8px;
  font-weight: 600;
}

.model-select option {
  background: #17191f;
}

.status {
  color: #92949d;
  font-size: 12px;
}

/* Chat area */

.content {
  flex: 1;
  overflow-y: auto;
}

.welcome {
  max-width: 760px;
  margin: 0 auto;
  padding: 14vh 24px 40px;
}

.welcome h1 {
  font-size: 40px;
  font-weight: 550;
  letter-spacing: -1.5px;
  margin-bottom: 10px;
}

.welcome p {
  color: #a5a6ad;
  font-size: 16px;
  margin-bottom: 35px;
}

.prompt-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.prompt-card {
  background: #191b21;
  border: 1px solid #30323b;
  border-radius: 13px;
  padding: 16px;
  text-align: left;
  min-height: 90px;
}

.prompt-card:hover {
  background: #22242b;
  border-color: #777078;
}

.prompt-card strong {
  display: block;
  font-size: 14px;
  margin-bottom: 7px;
}

.prompt-card span {
  color: #a6a7ae;
  font-size: 12px;
}

.messages {
  max-width: 790px;
  margin: auto;
  padding: 35px 24px;
}

.message {
  display: flex;
  gap: 13px;
  margin-bottom: 28px;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 690px;
  overflow-wrap: anywhere;
  line-height: 1.65;
}

.message.user .bubble {
  background: #252832;
  border-radius: 18px;
  padding: 12px 16px;
}

.assistant-icon {
  width: 29px;
  height: 29px;
  background: #d77b5b;
  color: #241713;
  border-radius: 9px;
  display: grid;
  place-items: center;
  font-weight: 800;
  flex-shrink: 0;
}

.answer {
  white-space: pre-wrap;
}

.answer pre {
  background: #1a1c22;
  border: 1px solid #30323a;
  border-radius: 10px;
  padding: 14px;
  overflow-x: auto;
}

.answer code {
  font-family: Consolas, monospace;
  font-size: 13px;
}

/* Composer */

.composer-wrap {
  padding: 12px 24px 18px;
}

.composer {
  max-width: 790px;
  margin: auto;
  background: #1d1f25;
  border: 1px solid #41434b;
  border-radius: 17px;
  padding: 10px 12px;
}

.composer:focus-within {
  border-color: #77747a;
}

textarea {
  width: 100%;
  min-height: 32px;
  max-height: 180px;
  resize: none;
  outline: none;
  border: none;
  background: transparent;
  color: white;
  padding: 5px;
}

textarea::placeholder {
  color: #858790;
}

.composer-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 7px;
}

.tool-btn {
  background: transparent;
  border: none;
  color: #aaaeb6;
  padding: 7px;
  border-radius: 8px;
}

.tool-btn:hover {
  background: #2b2d34;
}

.send {
  width: 35px;
  height: 35px;
  border: none;
  border-radius: 10px;
  background: #e17c5b;
  color: #211712;
  font-size: 20px;
}

.disclaimer {
  text-align: center;
  color: #777982;
  font-size: 11px;
  margin: 10px auto 0;
}

/* Mobile */

@media (max-width: 700px) {
  .sidebar {
    display: none;
  }

  .topbar {
    padding: 0 12px;
  }

  .welcome {
    padding: 10vh 18px 30px;
  }

  .welcome h1 {
    font-size: 30px;
  }

  .prompt-grid {
    grid-template-columns: 1fr;
  }

  .composer-wrap {
    padding: 10px 12px;
  }

  .messages {
    padding: 25px 16px;
  }
}
</style>
</head>

<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <div class="logo">B</div>

      <div class="brand-text">
        <span class="brand-name">BharatGPilot</span>
        <span class="brand-tagline">Designed by Mohit Saha</span>
      </div>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="section-label">Your conversations</div>

    <div class="history" id="history"></div>

    <div class="profile">
      MConnect Bharat<br>
      <span style="color:#92949d;font-size:11px">
        AI workspace
      </span>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">

    <header class="topbar">
      <select class="model-select" id="model">
        <option value="default">BharatGPilot · Auto</option>
        <option value="claude">Claude</option>
        <option value="openrouter">OpenRouter</option>
      </select>

      <span class="status" id="status">Ready</span>
    </header>

    <section class="content" id="content">

      <!-- Welcome screen -->
      <div class="welcome" id="welcome">
        <h1>What can I help with?</h1>

        <p>
          Ask, explore, create, and solve problems
          with BharatGPilot.
        </p>

        <div class="prompt-grid">

          <button class="prompt-card"
            onclick="usePrompt('Help me build a full-stack web app step by step.')">
            <strong>Build something</strong>
            <span>Plan and create a web app</span>
          </button>

          <button class="prompt-card"
            onclick="usePrompt('Explain this topic clearly, with examples: ')">
            <strong>Learn and understand</strong>
            <span>Break down complex topics</span>
          </button>

          <button class="prompt-card"
            onclick="usePrompt('Review and improve this code:\n')">
            <strong>Write or debug code</strong>
            <span>Develop, troubleshoot, and refine</span>
          </button>

          <button class="prompt-card"
            onclick="usePrompt('Help me research this topic: ')">
            <strong>Research a topic</strong>
            <span>Explore evidence and open questions</span>
          </button>

        </div>
      </div>

      <!-- Messages -->
      <div class="messages" id="messages" hidden></div>

    </section>

    <!-- Input -->
    <div class="composer-wrap">

      <div class="composer">

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message BharatGPilot…"
          aria-label="Message BharatGPilot">
        </textarea>

        <div class="composer-row">

          <div>
            <input
              type="file"
              id="fileInput"
              hidden
              multiple
              accept=".txt,.md,.pdf,.png,.jpg,.jpeg,.webp,.csv,.json,.js,.ts,.py,.html,.css">

            <button class="tool-btn"
              onclick="document.getElementById('fileInput').click()">
              ＋ Attach
            </button>
          </div>

          <button class="send" id="sendBtn"
            onclick="sendMessage()"
            aria-label="Send message">
            ↑
          </button>

        </div>
      </div>

      <div class="disclaimer">
        BharatGPilot can make mistakes.
        Verify important information.
      </div>

    </div>
  </main>
</div>

<script>
let chats = [];
let activeChat = null;
let busy = false;
let attachments = [];

const promptBox = document.getElementById("prompt");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function formatText(text) {
  let safe = escapeHTML(text);

  safe = safe.replace(
    /```([\w-]*)\n?([\s\S]*?)```/g,
    (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`
  );

  safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
  safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/\n/g, "<br>");

  return safe;
}

function newChat() {
  const chat = {
    id: Date.now(),
    title: "New conversation",
    items: []
  };

  chats.push(chat);
  activeChat = chat.id;
  render();
}

function currentChat() {
  return chats.find(chat => chat.id === activeChat);
}

function render() {
  const chat = currentChat();
  const hasMessages = chat && chat.items.length > 0;

  welcome.hidden = !!hasMessages;
  messages.hidden = !hasMessages;
  messages.innerHTML = "";

  if (hasMessages) {
    chat.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "message " + item.role;

      if (item.role === "assistant") {
        const icon = document.createElement("div");
        icon.className = "assistant-icon";
        icon.textContent = "B";
        row.appendChild(icon);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const answer = document.createElement("div");
      answer.className = "answer";
      answer.innerHTML = formatText(item.content);

      bubble.appendChild(answer);
      row.appendChild(bubble);
      messages.appendChild(row);
    });
  }

  renderHistory();
  document.getElementById("content").scrollTop =
    document.getElementById("content").scrollHeight;
}

function renderHistory() {
  const history = document.getElementById("history");
  history.innerHTML = "";

  [...chats].reverse().forEach(chat => {
    const button = document.createElement("button");
    button.textContent = chat.title;
    button.onclick = () => {
      activeChat = chat.id;
      render();
    };
    history.appendChild(button);
  });
}

function usePrompt(text) {
  promptBox.value = text;
  promptBox.focus();
  resizeInput();
}

function resizeInput() {
  promptBox.style.height = "auto";
  promptBox.style.height =
    Math.min(promptBox.scrollHeight, 180) + "px";
}

promptBox.addEventListener("input", resizeInput);

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("fileInput").addEventListener("change", event => {
  attachments.push(...Array.from(event.target.files));
  event.target.value = "";
});

async function sendMessage() {
  const text = promptBox.value.trim();

  if ((!text && !attachments.length) || busy) return;

  if (!activeChat) newChat();

  const chat = currentChat();
  const selectedFiles = attachments.slice();

  const userText = text +
    (selectedFiles.length
      ? "\n\nAttached: " + selectedFiles.map(file => file.name).join(", ")
      : "");

  chat.items.push({
    role: "user",
    content: userText
  });

  if (chat.items.length === 1) {
    chat.title = text.slice(0, 40) || "New conversation";
  }

  promptBox.value = "";
  resizeInput();
  attachments = [];

  const assistant = {
    role: "assistant",
    content: ""
  };

  chat.items.push(assistant);
  busy = true;

  document.getElementById("status").textContent = "Thinking…";
  document.getElementById("sendBtn").disabled = true;
  render();

  try {
    const form = new FormData();

    form.append("message", text);
    form.append("model", document.getElementById("model").value);
    form.append("history", JSON.stringify(
      chat.items.slice(0, -1).map(item => ({
        role: item.role,
        content: item.content
      }))
    ));

    selectedFiles.forEach(file => {
      form.append("files", file);
    });

    // Connect this endpoint to your BharatGPilot backend.
    const response = await fetch("/api/pilot/chat", {
      method: "POST",
      body: form
    });

    if (!response.ok) {
      throw new Error("AI backend returned HTTP " + response.status);
    }

    const data = await response.json();

    assistant.content =
      data.reply ||
      data.content ||
      data.message ||
      "The AI returned an empty response.";

  } catch (error) {
    assistant.content =
      "I could not connect to the AI backend.\n\n" +
      error.message +
      "\n\nConfigure your BharatGPilot backend and AI provider keys. " +
      "Do not place private API keys in this HTML file.";
  } finally {
    busy = false;
    document.getElementById("status").textContent = "Ready";
    document.getElementById("sendBtn").disabled = false;
    render();
  }
}

newChat();
</script>
</body>
</html>
